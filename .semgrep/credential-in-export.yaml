rules:
  - id: no-credentials-in-diagram-serialization
    languages: [typescript]
    message: >
      Database credential field (host, port, database, user, password) must
      not be added to diagram serialization or JSON export code. Credentials
      live in a separate connection model and must never be written to JSON.
    severity: ERROR
    pattern-regex: |
      (host|port|database|user|password)\s*:\s*

  - id: no-credentials-in-export-button
    languages: [typescript]
    message: >
      Database credential field (host, port, database, user, password) must
      not be referenced in export button / download handler code. Diagram
      export must never include connection credentials.
    severity: ERROR
    pattern-regex: |
      (host|port|database|user|password)\s*:\s*
