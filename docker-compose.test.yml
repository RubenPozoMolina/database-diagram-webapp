services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - qa-st001-network

  tests:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    user: "1000:1000"
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8080
      - HOME=/tmp
      - npm_config_cache=/tmp/.npm
    networks:
      - qa-st001-network
    volumes:
      - .:/work:rw
    tmpfs:
      - /tmp
      - /artifacts
    working_dir: /work
    command: sh -c "npm ci --ignore-scripts && npx playwright test"

networks:
  qa-st001-network:
    driver: bridge
