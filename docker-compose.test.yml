# docker-compose.test.yml
# Orchestrates app + test containers on a private network.
# No ports are published on the host; containers reach each other by service name.
services:
  app:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - qa-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 2s
      timeout: 2s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/work:ro
      - ./qa-artifacts:/artifacts
    working_dir: /work
    environment:
      - HOME=/tmp
      - npm_config_cache=/tmp/.npm
    depends_on:
      app:
        condition: service_healthy
    networks:
      - qa-network
    command: sh -c "cd frontend && npm ci --ignore-scripts && npm test"

networks:
  qa-network:
    driver: bridge
