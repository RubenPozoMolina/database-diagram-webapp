# Containerized test setup for the database-diagram-webapp.
# Orchestrates app + test containers on a private network.
# No ports are published on the host; containers reach each other by service name.
# Run: docker compose -f docker-compose.test.yml run --rm tests
services:
  app:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - qa-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 2s
      timeout: 2s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/work:ro
      - ./qa-artifacts:/artifacts
    working_dir: /work
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - HOME=/tmp
      - npm_config_cache=/tmp/.npm
    tmpfs:
      - /tmp
    depends_on:
      app:
        condition: service_healthy
    networks:
      - qa-network
    command: sh -c "npm run test --workspace=frontend && npm run test --workspace=backend && npm run test:root"

networks:
  qa-network:
    driver: bridge

volumes:
  qa-artifacts:
